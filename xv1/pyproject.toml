[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zq-xv1"
version = "4.0.0a1"
description = "XV1 Supreme agentic runtime prototypes"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "tenacity>=9,<10",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]
redis = ["redis>=5,<6"]
pqc = ["liboqs-python>=0.14,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
